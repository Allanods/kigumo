services:
  - type: web
    name: kigumo-django
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn Schoolweb.wsgi:application
    autoDeploy: true
    branch: master
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
        value: placeholder-secret
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
        value: kigumoschoolweb.onrender.com
      - key: DJANGO_DEBUG
        sync: false
        value: False
