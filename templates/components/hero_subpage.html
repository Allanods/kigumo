<section class="subpage-hero">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-8">
        <span class="eyebrow-tag mb-2">{{ eyebrow|default:"Kigumo Bendera High School" }}</span>
        <h1 class="font-serif fw-bold text-white mb-2">{{ title }}</h1>
        {% if subtitle %}
        <p class="text-white-50 fs-5 mb-3">{{ subtitle }}</p>
        {% endif %}
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb-kb mb-0 list-unstyled">
            <li><a href="{% url 'home' %}"><i class="bi bi-house-door me-1"></i> Home</a></li>
            <li><i class="bi bi-chevron-right text-white-50 small"></i></li>
            <li class="text-white fw-semibold">{{ breadcrumb|default:title }}</li>
          </ol>
        </nav>
      </div>
      {% if badge_text %}
      <div class="col-lg-4 text-lg-end d-none d-lg-block">
        <span class="badge bg-warning text-dark px-3 py-2 fs-6 rounded-pill">
          <i class="bi bi-star-fill me-1"></i> {{ badge_text }}
        </span>
      </div>
      {% endif %}
    </div>
  </div>
</section>
