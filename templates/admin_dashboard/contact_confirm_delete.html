{% extends "base.html" %}
{% block title %}Delete Contact Message{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Confirm Delete</h2>
  <p>Are you sure you want to delete the contact message from <strong>{{ contact.full_name }}</strong> submitted on {{ contact.created_at|date:"Y-m-d H:i" }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'admin_contact_detail' contact.pk %}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
